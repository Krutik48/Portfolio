<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VectorArk — Sizzler</title>
<style>
/* ── Reset & root ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #FFFFFF;
  --accent:   #3366EE;
  --accent2:  #6699FF;
  --text:     #111118;
  --text-dim: rgba(17,17,24,0.38);
  --glow:     rgba(51,102,238,0.35);
}

html, body {
  width: 100%; height: 100%;
  background: #FFFFFF;
  overflow: hidden;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
  color: var(--text);
  user-select: none;
}

/* ── Title / End card ─────────────────────────────────────────────────────── */
.fullcard {
  position: fixed; inset: 0; z-index: 90;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0;
  pointer-events: none;
  background: var(--bg);
}

.card-logo {
  font-size: clamp(3.5rem, 10vw, 8rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  background: linear-gradient(140deg, #111118 0%, var(--accent) 55%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.card-sub {
  margin-top: 1.2rem;
  font-size: clamp(0.6rem, 1.5vw, 0.85rem);
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* Light-streak sweep on title card */
#titleStreak {
  position: fixed; inset: 0; pointer-events: none; z-index: 91; opacity: 0;
  background: linear-gradient(
    120deg,
    transparent 20%,
    rgba(51,102,238,0.09) 50%,
    transparent 80%
  );
  transform: translateX(-100%);
}

/* ── Stage wrapper ────────────────────────────────────────────────────────── */
#stageWrap {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
}

#stage {
  position: relative;
  width:  min(calc(100vh - 60px), calc(100vw - 60px));
  height: min(calc(100vh - 60px), calc(100vw - 60px));
}

#mainSvg {
  width: 100%; height: 100%;
  display: block;
  background: #FFFFFF;
  transform-origin: center center;
}

/* ── Stage label ──────────────────────────────────────────────────────────── */
#stageLabel {
  position: absolute;
  bottom: 12px; left: 14px;
  font-size: 0.57rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 5;
}

/* ── SVG layer fade ──────────────────────────────────────────────────────── */
#lyrRaster, #lyrRef, #lyrSkeleton {
  transition: opacity 1.2s ease;
}

/* ── Anchor animations (Illustrator outline-mode style) ──────────────────── */
@keyframes anchorPop {
  0%   { transform: scale(0); opacity: 0; }
  65%  { transform: scale(1.25); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

.anchor-rect {
  opacity: 0;
  transform: scale(0);
  transform-box: fill-box;
  transform-origin: center;
}
.anchor-rect.shown {
  animation: anchorPop 0.35s cubic-bezier(0.34,1.3,0.64,1) forwards;
}

.handle-circle { opacity: 0; transition: opacity 0.25s ease; }
.handle-circle.shown { opacity: 1; }

.handle-line { opacity: 0; transition: opacity 0.3s ease; }
.handle-line.shown { opacity: 0.75; }

/* ── Color-flash glow ─────────────────────────────────────────────────────── */
@keyframes colorFlash {
  0%   { filter: none; }
  40%  { filter: drop-shadow(0 0 7px rgba(51,102,238,0.5))
                 drop-shadow(0 0 14px rgba(102,153,255,0.35)); }
  100% { filter: none; }
}
.color-flash { animation: colorFlash 0.7s ease forwards; }
</style>
</head>
<body>

<div id="titleStreak"></div>

<!-- ── Title card ─────────────────────────────────────────────────────────── -->
<div id="titleCard" class="fullcard">
  <div class="card-logo">VectorArk</div>
  <div class="card-sub">Raster &nbsp;·&nbsp; Vector &nbsp;·&nbsp; Intelligence</div>
</div>

<!-- ── End card ───────────────────────────────────────────────────────────── -->
<div id="endCard" class="fullcard">
  <div class="card-logo" style="font-size:clamp(2rem,6vw,4.5rem)">VectorArk</div>
  <div class="card-sub" style="margin-top:0.8rem">adobe research</div>
</div>

/* ==========================================================================
   UTILITIES
   ========================================================================== */
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }
function easeOut(t)   { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t){ return a + (b - a) * t; }

let _panRaf = null;

// Convert a viewBox [x, y, w, h] into CSS transform params.
// The SVG viewBox stays fixed at "0 0 1024 1024"; instead we
// scale+translate the element so the desired region fills the stage.
// transform-origin is center, so tx/ty are fractions of the SVG size.
function _vbToXform(vb) {
  const [x, y, w, h] = vb;
  return {
    s:  1024 / w,
    tx: (512 - x - w * 0.5) / 1024,
    ty: (512 - y - h * 0.5) / 1024,
  };
}

function animTransform(fromVB, toVB, dur, onDone, easeFn) {
  if (_panRaf) cancelAnimationFrame(_panRaf);
  const fn   = easeFn || easeInOut;
  const t0   = performance.now();
  const from = _vbToXform(fromVB);
  const to   = _vbToXform(toVB);
  function step(now) {
    const raw = Math.min((now - t0) / dur, 1);
    const p   = fn(raw);
    const s   = lerp(from.s,  to.s,  p);
    const tx  = lerp(from.tx, to.tx, p);
    const ty  = lerp(from.ty, to.ty, p);
    if (s <= 1.001 && Math.abs(tx) < 0.001 && Math.abs(ty) < 0.001) {
      mainSvg.style.transform = '';
    } else {
      mainSvg.style.transform =
        `scale(${s.toFixed(4)}) translate(${(tx * 100).toFixed(3)}%, ${(ty * 100).toFixed(3)}%)`;
    }
    if (raw < 1) _panRaf = requestAnimationFrame(step);
    else { _panRaf = null; onDone && onDone(); }
  }
  _panRaf = requestAnimationFrame(step);
}

   ========================================================================== */

// Build SVG path d-string for a polygon at rounding progress t (0=sharp, 1=fully rounded).
// enter(i,t): where the path arrives at corner i  — lerped from vertex toward ts as t→1
// exit(i,t):  where the path leaves corner i       — lerped from vertex toward te as t→1
function buildPolyPath(polygon, t) {
  const c = polygon.corners;
  const n = c.length;
  if (n === 0) return 'M 0,0';

  const fmt = v => v.toFixed(2);

  function enter(i) {
    const v = c[i];
    if (!v.ts || t <= 0) return [v.x, v.y];
    return [v.x + (v.ts[0] - v.x) * t, v.y + (v.ts[1] - v.y) * t];
  }
  function exit_(i) {
    const v = c[i];
    if (!v.te || t <= 0) return [v.x, v.y];
    return [v.x + (v.te[0] - v.x) * t, v.y + (v.te[1] - v.y) * t];
  }

  const [sx, sy] = enter(0);
  let d = `M ${fmt(sx)},${fmt(sy)}`;

  // Arc at corner 0 (if rounded)
  if (c[0].ts && t > 0) {
    const [ex, ey] = exit_(0);
    const r = c[0].r * t;
    d += ` A ${fmt(r)},${fmt(r)} 0 0 ${c[0].sweep ? 1 : 0} ${fmt(ex)},${fmt(ey)}`;
  }

  // Corners 1…n-1
  for (let i = 1; i < n; i++) {
    const [enx, eny] = enter(i);
    d += ` L ${fmt(enx)},${fmt(eny)}`;
    if (c[i].ts && t > 0) {
      const [exx, exy] = exit_(i);
      const r = c[i].r * t;
      d += ` A ${fmt(r)},${fmt(r)} 0 0 ${c[i].sweep ? 1 : 0} ${fmt(exx)},${fmt(exy)}`;
    }
  }

  if (polygon.isClosed) d += ' Z';
  return d;
}

// Partial path builder: drawN corners shown, roundProgress[i] in [0,1] per corner.
function buildPolyPathPartial(polygon, drawN, roundProgress) {
  const c = polygon.corners;
  const active = Math.min(Math.max(drawN, 1), c.length);
  const fmt = v => v.toFixed(2);
  const rt = i => roundProgress[i] || 0;

  function enter(i) {
    const v = c[i], t = rt(i);
    if (!v.ts || t <= 0) return [v.x, v.y];
    return [v.x + (v.ts[0] - v.x) * t, v.y + (v.ts[1] - v.y) * t];
  }
  function exit_(i) {
    const v = c[i], t = rt(i);
    if (!v.te || t <= 0) return [v.x, v.y];
    return [v.x + (v.te[0] - v.x) * t, v.y + (v.te[1] - v.y) * t];
  }
  function arc(i) {
    const t = rt(i);
    if (!c[i].ts || t <= 0) return '';
    const [ex, ey] = exit_(i);
    const r = c[i].r * t;
    return ` A ${fmt(r)},${fmt(r)} 0 0 ${c[i].sweep ? 1 : 0} ${fmt(ex)},${fmt(ey)}`;
  }

  const [sx, sy] = enter(0);
  let d = `M ${fmt(sx)},${fmt(sy)}` + arc(0);
  for (let i = 1; i < active; i++) {
    const [enx, eny] = enter(i);
    d += ` L ${fmt(enx)},${fmt(eny)}` + arc(i);
  }
  if (polygon.isClosed && active >= c.length) d += ' Z';
  return d;
}

// Build + cache polygon SVG elements into lyrPolygons. Called once per run.
const _polyElems = [];
function buildPolygonPaths() {
  lyrPolygons.innerHTML = '';
  _polyElems.length = 0;

  POLYGONS_RAW.forEach(poly => {
    const el = document.createElementNS(SVG_NS, 'path');
    el.setAttribute('d', buildPolyPath(poly, 0));
    el.style.fill        = 'none';
    el.style.stroke      = 'rgba(51,102,238,0.85)';
    el.style.strokeWidth = '1';
    el.style.opacity     = '0';
    if (!poly.isFill) {
      el.setAttribute('stroke-linecap',  poly.cap  || 'butt');
      el.setAttribute('stroke-linejoin', poly.join || 'miter');
    }
    lyrPolygons.appendChild(el);

    const dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('r', '5');
    dot.setAttribute('fill', 'rgba(51,102,238,0.9)');
    dot.setAttribute('stroke', 'white');
    dot.setAttribute('stroke-width', '1.5');
    dot.style.opacity = '0';
    dot.style.pointerEvents = 'none';
    lyrPolygons.appendChild(dot);

    el._poly = poly;
    el._dot  = dot;
    _polyElems.push(el);
  });
}

// After all polygons are colored, set the real output paths to the same appearance
// then cross-fade: polygon layer fades out, clean output layer fades in.
function revealFinalOutput() {
  _outElems.forEach((el, i) => {
    const p = PATHS[i];
    if (!p) return;
    el.style.transition      = 'none';
    el.style.strokeDasharray  = 'none';
    el.style.strokeDashoffset = '0';
    el.style.opacity         = '0';
    if (p.fill && p.fill !== 'none') {
      el.style.fill = p.fill;
    } else {
      el.style.fill = 'none';
    }
    if (p.stroke && p.stroke !== 'none') {
      el.style.stroke      = p.stroke;
      el.style.strokeWidth = String(parseFloat(p.sw) || 1);
      if (p.linecap)  el.setAttribute('stroke-linecap',  p.linecap);
      if (p.linejoin) el.setAttribute('stroke-linejoin', p.linejoin);
    } else {
      el.style.stroke      = 'none';
      el.style.strokeWidth = '0';
    }
    if (p.opacity && p.opacity !== '1') el.setAttribute('opacity', p.opacity);
  });

  requestAnimationFrame(() => {
    // Fade in clean output layer while polygon layer fades out (seamless cross-fade)
    _outElems.forEach(el => {
      el.style.transition = 'opacity 0.5s ease';
      el.style.opacity    = '1';
    });
    lyrPolygons.style.transition = 'opacity 0.5s ease';
    lyrPolygons.style.opacity    = '0';
    lyrRef.style.transition      = 'opacity 0.5s ease';
    lyrRef.style.opacity         = '0';
  });
}

// Corner-by-corner reveal: snap each vertex in, immediately round its predecessor
// once three points are known. Total per-polygon time matches the old draw+round budget.
// Returns total duration in ms.
function schedulePolySequence(baseT, elems, T, onAllDone) {
  if (elems.length === 0) {
    if (onAllDone) sched(baseT, onAllDone);
    return 0;
  }
  const gap = T.polyStagger;
  let offset = 0;

  elems.forEach((el, i) => {
    const poly   = el._poly;
    const c      = poly.corners;
    const n      = c.length;
    // For closed polygons the closing step (Z + round corners 0 & n-1) counts as one extra step.
    const steps = Math.max(poly.isClosed ? n : n - 1, 1);
    // Scale total draw/round budget sub-linearly with corner count so short paths feel
    // deliberate and long paths trace fluidly. Normalised so 7 corners → scale=1.
    const _scale         = Math.pow(steps / 7, 0.35);
    const actualDraw     = Math.round(T.polyDraw  * _scale);
    const actualRound    = Math.round(T.polyRound * _scale);
    const segGap         = actualDraw  / steps;   // ms between corner additions
    const roundDurCorner = actualRound / steps;   // ms to animate one corner's arc
    const polyTotalDur   = Math.round(actualDraw + roundDurCorner) + T.colorDur;

    ;(function(startOff, elem, idx) {
      const rp = new Array(n).fill(0);  // roundProgress per corner
      let drawN = 1;
      let colorApplied = false;

      function moveDot(ci) {
        const dc = c[ci];
        const dot = elem._dot;
        dot.setAttribute('cx', dc.x.toFixed(2));
        dot.setAttribute('cy', dc.y.toFixed(2));
        dot.style.opacity = '1';
        // Pop-in: animate r from 0 → 5 over 120 ms
        const _t0 = performance.now();
        (function popIn(now) {
          dot.setAttribute('r', (5 * easeOut(Math.min((now - _t0) / 120, 1))).toFixed(2));
          if (now - _t0 < 120) requestAnimationFrame(popIn);
        })(performance.now());
      }
      function hideDot() {
        const dot = elem._dot;
        const _t0 = performance.now();
        (function collapse(now) {
          const raw = Math.min((now - _t0) / 200, 1);
          dot.setAttribute('r', (5 * (1 - easeOut(raw))).toFixed(2));
          if (raw < 1) {
            requestAnimationFrame(collapse);
          } else {
            dot.style.opacity = '0';
            dot.setAttribute('r', '5');  // reset for reuse
          }
        })(performance.now());
      }

      function applyColor() {
        if (colorApplied) return;
        colorApplied = true;
        const pIdx = (poly.pathIdx != null) ? poly.pathIdx : idx;
        const p = PATHS[pIdx];
        if (!p) return;
        const hasFill   = p.fill   && p.fill   !== 'none';
        const hasStroke = p.stroke && p.stroke !== 'none';
        elem.style.transition =
          `fill ${T.colorDur}ms ease, ` +
          `stroke ${Math.round(T.colorDur * 0.7)}ms ease, ` +
          `stroke-width ${Math.round(T.colorDur * 0.5)}ms ease`;
        // Dim during animation so lower-z polygons remain visible
        elem.style.opacity = String(T.drawOpacity != null ? T.drawOpacity : 0.65);
        if (hasFill) {
          elem.style.fill = p.fill;
        } else {
          elem.style.fill = 'none';
        }
        if (hasStroke) {
          const targetSW = parseFloat(p.sw) || 1;
          elem.style.strokeWidth = `${targetSW}`;
          elem.style.stroke      = p.stroke;
          if (p.linecap)  elem.setAttribute('stroke-linecap',  p.linecap);
          if (p.linejoin) elem.setAttribute('stroke-linejoin', p.linejoin);

          elem.style.stroke      = 'none';
          elem.style.strokeWidth = '0';

        elem.style.opacity          = '1';
        elem.style.stroke           = 'rgba(51,102,238,0.85)';
        elem.style.strokeWidth      = '1.2';
        elem.style.strokeDasharray  = 'none';
        elem.style.strokeDashoffset = '0';
        elem.style.transition       = 'none';
        elem.setAttribute('d', buildPolyPathPartial(poly, 1, rp));
        moveDot(0);
      });

      for (let k = 1; k <= steps; k++) {
        ;(function(kk, stepOff) {
          sched(baseT + startOff + stepOff, () => {
            if (kk < n) { drawN = kk + 1; moveDot(kk); }
            else { hideDot(); }  // closing step: polygon sealed, dot collapses
            elem.setAttribute('d', buildPolyPathPartial(poly, drawN, rp));

            // Corners eligible for rounding at this step
            const toRound = [];
            if (poly.isClosed && kk === n) {
              if (c[0].ts)     toRound.push(0);
              if (c[n-1].ts)   toRound.push(n - 1);
            } else if (kk >= 2) {
              const ci = kk - 1;
              const ok = poly.isClosed ? true : (ci > 0 && ci < n - 1);
              if (ok && c[ci].ts) toRound.push(ci);
            }

            const isLastStep = (kk === steps);
            if (toRound.length > 0) {
              const t0 = performance.now();
              (function roundStep(now) {
                const raw = Math.min((now - t0) / roundDurCorner, 1);
                const t   = easeOut(raw);
                toRound.forEach(ci => { rp[ci] = t; });
                elem.setAttribute('d', buildPolyPathPartial(poly, drawN, rp));
                if (raw < 1) {
                  requestAnimationFrame(roundStep);
                } else {
                  toRound.forEach(ci => { rp[ci] = 1; });
                  if (isLastStep) { hideDot(); applyColor(); }
                }
              })(performance.now());
            } else if (isLastStep) {
              hideDot();
              applyColor();
            }
          });
        })(k, Math.round(k * segGap));
      }
    })(offset, el, i);

    offset += polyTotalDur + gap;
  });

  const totalDur = offset - gap;
  if (onAllDone) sched(baseT + totalDur, onAllDone);
  return totalDur;
}

/* ==========================================================================
   TIMEOUT MANAGEMENT
   ========================================================================== */
const _tids = [];
function sched(ms, fn) { _tids.push(setTimeout(fn, ms)); }
function clearAll() {
  _tids.forEach(clearTimeout); _tids.length = 0;
  if (_panRaf) { cancelAnimationFrame(_panRaf); _panRaf = null; }
  clearTimeout(_labelTimer);
}

/* ==========================================================================
   POLYGON-ONLY DEBUG SEQUENCE
   Sets up the post-reconstruction visual state instantly, runs the polygon
   build stage, then holds the final polygon output permanently.
   ========================================================================== */
function startPolygonStage() {
  clearAll();

  // Visual state as if reconstruction pause just ended
  mainSvg.setAttribute('viewBox', '0 0 1024 1024');
  mainSvg.style.transform  = '';
  mainSvg.style.transition = '';

  lyrRaster.style.transition   = 'none'; lyrRaster.style.opacity   = '0';
  lyrSkeleton.style.transition = 'none'; lyrSkeleton.style.opacity = '0';
  lyrRef.style.transition      = 'none'; lyrRef.style.opacity      = '0.12';
  lyrPolygons.style.transition = 'none'; lyrPolygons.style.opacity = '1';

  document.querySelectorAll('.anchor-rect').forEach(c => c.classList.remove('shown'));
  document.querySelectorAll('.handle-circle').forEach(c => c.classList.remove('shown'));
  document.querySelectorAll('.handle-line').forEach(l => l.classList.remove('shown'));

  buildOutputPaths();
  buildPolygonPaths();


  schedulePolySequence(0, _polyElems, CONFIG.TIMING, revealFinalOutput);

  // Holds after final output appears — do not proceed further
}

/* ==========================================================================
   FULL ANIMATION SEQUENCE
   ========================================================================== */
function startSizzler() {
  clearAll();

  // ── Reset ─────────────────────────────────────────────────────────────────
  mainSvg.setAttribute('viewBox', '0 0 1024 1024');
  mainSvg.style.transform  = '';
  mainSvg.style.transition = '';

  lyrRaster.style.transition   = 'none'; lyrRaster.style.opacity   = '0';
  lyrRef.style.transition      = 'none'; lyrRef.style.opacity      = '0';
  lyrSkeleton.style.transition = 'none'; lyrSkeleton.style.opacity = '0';

  titleCard.style.opacity     = '0';
  endCard.style.opacity       = '0';
  titleStreak.style.opacity   = '0';
  titleStreak.style.transform = 'translateX(-100%)';

  stageLabel.style.opacity = '0';
  stageLabel.textContent   = '';
  stage.style.transform    = '';
  stage.style.transition   = '';

  document.querySelectorAll('.anchor-rect').forEach(c => c.classList.remove('shown'));
  document.querySelectorAll('.handle-circle').forEach(c => c.classList.remove('shown'));
  document.querySelectorAll('.handle-line').forEach(l => l.classList.remove('shown'));

  lyrPolygons.style.transition = 'none';
  lyrPolygons.style.opacity    = '1';

  buildOutputPaths();
  if (CONFIG.SHOW_POLYGON_BUILD) buildPolygonPaths();

  // ── Debug shortcut: jump straight to polygon stage ────────────────────────
  if (CONFIG.DEBUG_POLYGON_ONLY && CONFIG.SHOW_POLYGON_BUILD && POLYGONS_RAW.length > 0) {
    startPolygonStage();
    return;
  }

  // ── Timeline ─────────────────────────────────────────────────────────────
  let t  = 0;
  let si = 0;

  // ── 0. Title card ─────────────────────────────────────────────────────────
  if (CONFIG.SHOW_BRANDING) {
    const myS = si++;
    sched(t, () => {
      setStage(myS);
      titleCard.style.transition = `opacity ${CONFIG.TIMING.titleFade}ms ease`;
      titleCard.style.opacity = '1';
      setTimeout(() => {
        titleStreak.style.transition = 'none';
        titleStreak.style.opacity = '1';
        titleStreak.style.transform = 'translateX(-100%)';
        setTimeout(() => {
          titleStreak.style.transition = 'transform 2s cubic-bezier(0.4,0,0.2,1)';
          titleStreak.style.transform = 'translateX(200%)';
        }, 20);
      }, 400);
    });
    sched(t + CONFIG.TIMING.title - CONFIG.TIMING.titleFade, () => {
      titleCard.style.transition = `opacity ${CONFIG.TIMING.titleFade}ms ease`;
      titleCard.style.opacity = '0';
    });
    t += CONFIG.TIMING.title;
  }

  // ── 1. Raster display ─────────────────────────────────────────────────────
  {
    const myS = si++;
    sched(t, () => {
      setStage(myS);
      stage.style.transition = 'none';
      stage.style.transform  = 'scale(1.04)';
      setTimeout(() => {
        stage.style.transition = `transform ${CONFIG.TIMING.raster + CONFIG.TIMING.dissolve}ms cubic-bezier(0.2,0,0,1)`;
        stage.style.transform  = 'scale(1.0)';
        lyrRaster.style.transition = `opacity 600ms ease`;
        lyrRaster.style.opacity = '1';
      }, 30);
    });
    t += CONFIG.TIMING.raster;
  }

  // ── 2. Imagetrace dissolve — skeleton + reference backdrop fade in ─────────
  {
    const myS = si++;
    sched(t, () => {
      setStage(myS);
      // Raster fades out
      lyrRaster.style.transition = `opacity ${CONFIG.TIMING.dissolve}ms ease`;
      lyrRaster.style.opacity    = '0';
      // Skeleton fades in (wireframe)
      lyrSkeleton.style.transition = `opacity ${CONFIG.TIMING.dissolve}ms ease`;
      lyrSkeleton.style.opacity    = '1';
      // Reference (k6Color) backdrop — optional, controlled by SHOW_REF_BACKDROP
      if (CONFIG.SHOW_REF_BACKDROP) {
        lyrRef.style.transition = `opacity ${Math.round(CONFIG.TIMING.dissolve * 1.3)}ms ease`;
        lyrRef.style.opacity    = '0.4';
      }
    });
    t += CONFIG.TIMING.dissolve;
  }

  // ── 3. Anchor points — all at once ────────────────────────────────────────
  {
    const myS = si++;
    sched(t, () => {
      if (CONFIG.SHOW_ANCHORS) {
        setStage(myS);
        // All anchors pop in simultaneously
        document.querySelectorAll('.anchor-rect').forEach(c => c.classList.add('shown'));
        // Handle lines and circles appear shortly after
        setTimeout(() => {
          document.querySelectorAll('.handle-line').forEach(l => l.classList.add('shown'));
          setTimeout(() => {
            document.querySelectorAll('.handle-circle').forEach(h => h.classList.add('shown'));
          }, 220);
        }, 300);
      }
    });
    t += CONFIG.TIMING.anchors;
  }

  // ── 4. Zoom in + left→right pan per zone ─────────────────────────────────
  {
    const myS = si++;
    // Label persists from dissolve stage — no setStage call here

    const Z   = CONFIG.ZOOM;
    const zW  = 1024 / Z;
    const zH  = 1024 / CONFIG.N_TURNS;

    // Pre-compute left/right viewBox for each zone
    const leftVBs  = Array.from({length: CONFIG.N_TURNS}, (_, z) =>
      [0, z * zH, zW, zH]);
    const rightVBs = Array.from({length: CONFIG.N_TURNS}, (_, z) =>
      [1024 - zW, z * zH, zW, zH]);

    let schedTime = t;

    // Zoom into first zone (top-left)
    sched(schedTime, () =>
      animTransform([0, 0, 1024, 1024], leftVBs[0], CONFIG.TIMING.panZoomIn, null));
    schedTime += CONFIG.TIMING.panZoomIn;

    for (let z = 0; z < CONFIG.N_TURNS; z++) {
      // Sweep left→right
      ;(function(lv, rv, st) {
        sched(st, () => animTransform(lv, rv, CONFIG.TIMING.panSweep, null, easeInOut));
      })(leftVBs[z], rightVBs[z], schedTime);
      schedTime += CONFIG.TIMING.panSweep;

      if (z < CONFIG.N_TURNS - 1) {
        // Cross to next zone (top-right → next-zone top-left)
        ;(function(rv, nlv, st) {
          sched(st, () => animTransform(rv, nlv, CONFIG.TIMING.panCross, null));
        })(rightVBs[z], leftVBs[z + 1], schedTime);
        schedTime += CONFIG.TIMING.panCross;
      }
    }

    t = schedTime;
  }

  // ── 5. Zoom out → clear skeleton → pause with only k6color reference ────────
  {
    const myS = si++;
    sched(t, () => {
      // Label persists from pan stage — no setStage call here

      // Zoom out from last zone's right edge back to full view
      const Z  = CONFIG.ZOOM;
      const zW = 1024 / Z;
      const zH = 1024 / CONFIG.N_TURNS;
      const fromVB = [1024 - zW, (CONFIG.N_TURNS - 1) * zH, zW, zH];
      animTransform(fromVB, [0, 0, 1024, 1024], CONFIG.TIMING.zoomOut, null);

      // Skeleton fades out completely — stage clears
      lyrSkeleton.style.transition = `opacity ${CONFIG.TIMING.zoomOut}ms ease`;
      lyrSkeleton.style.opacity    = '0';

      // Reference (k6Color) settles briefly to give context, then dims further
      lyrRef.style.transition = `opacity ${CONFIG.TIMING.refFadeIn}ms ease`;
      lyrRef.style.opacity    = '0.30';
    });
    t += CONFIG.TIMING.zoomOut + CONFIG.TIMING.clearHold;
  }

  // ── 6. Polygon build — sequential: draw → round → color per polygon ─────────
  if (CONFIG.SHOW_POLYGON_BUILD && POLYGONS_RAW.length > 0) {
    const myS = si++;
    const T = CONFIG.TIMING;

    sched(t, () => {
      setStage(myS);
      lyrRef.style.transition = `opacity ${T.polyDraw}ms ease`;
      lyrRef.style.opacity    = '0.12';
    });

    const polyTotal = schedulePolySequence(t, _polyElems, T, revealFinalOutput);

    t += polyTotal + 900; // buffer: rounding done + cross-fade completes
  }

  // ── 7. Path outline reveal — skipped when polygon build provides the output
  if (!CONFIG.SHOW_POLYGON_BUILD || !POLYGONS_RAW.length) {
    const myS = si++;
    sched(t, () => {
      setStage(myS);
      lyrRef.style.transition = `opacity ${CONFIG.TIMING.pathDraw}ms ease`;
      lyrRef.style.opacity    = '0.20';
    });

    _outElems.forEach((el, i) => {
      sched(t + i * CONFIG.TIMING.pathStagger, () => {
        el.style.stroke = 'rgba(51,102,238,0.85)';
        el.style.transition = `stroke-dashoffset ${CONFIG.TIMING.pathDraw}ms cubic-bezier(0.4,0,0.2,1)`;
        el.style.strokeDashoffset = '0';
      });
    });
    t += _outElems.length * CONFIG.TIMING.pathStagger + CONFIG.TIMING.pathDraw + 150;
  }

  // ── 8. Colour materialisation — skipped when polygon build provides the output
  if (!CONFIG.SHOW_POLYGON_BUILD || !POLYGONS_RAW.length) {
    const myS = si++;
    sched(t, () => setStage(myS));

    const refStart = 0.20;
    const refStep  = refStart / Math.max(_outElems.length, 1);

    _outElems.forEach((el, i) => {
      sched(t + i * CONFIG.TIMING.colorStagger, () => {
        const p = PATHS[i];
        const hasFill   = p.fill   && p.fill   !== 'none';
        const hasStroke = p.stroke && p.stroke !== 'none';

        el.style.transition =
          `fill ${CONFIG.TIMING.colorDur}ms ease, ` +
          `stroke ${CONFIG.TIMING.colorDur}ms ease, ` +
          `stroke-width ${Math.round(CONFIG.TIMING.colorDur * 1.6)}ms cubic-bezier(0.2,0,0,1)`;
        if (hasFill) {
          el.style.fill = p.fill;
        } else {
          el.style.fill = 'none';
        }
        if (hasStroke) {
          const targetSW = parseFloat(p.sw) || 3;
          el.style.strokeWidth = `${targetSW}`;
          el.style.stroke      = p.stroke;
          el.style.strokeDasharray  = 'none';
          el.style.strokeDashoffset = '0';
          if (p.linecap)  el.setAttribute('stroke-linecap',  p.linecap);
          if (p.linejoin) el.setAttribute('stroke-linejoin', p.linejoin);
        } else {
          el.style.stroke      = 'none';
          el.style.strokeWidth = '0';
        }

        el.classList.add('color-flash');
        setTimeout(() => el.classList.remove('color-flash'), CONFIG.TIMING.colorDur + 350);

        const newRef = Math.max(0, refStart - refStep * (i + 1));
        lyrRef.style.opacity = String(Math.round(newRef * 100) / 100);
      });
    });
    t += _outElems.length * CONFIG.TIMING.colorStagger + CONFIG.TIMING.colorDur + 300;
  }

  // ── 8. Final hold — show colourised result, then stop ────────────────────
  {
    const myS = si++;
    sched(t, () => {
      setStage(myS);
      // Ensure any lingering layers are fully hidden
      lyrSkeleton.style.transition = 'opacity 0.6s ease';
      lyrSkeleton.style.opacity    = '0';
      lyrRef.style.transition      = 'opacity 0.6s ease';
      lyrRef.style.opacity         = '0';
    });
    // Hold the final colourised output on screen — fade label after a moment
    sched(t + CONFIG.TIMING.finalHold, () => {
      stageLabel.style.opacity = '0';
    });
    t += CONFIG.TIMING.finalHold;
  }

  // ── 9. End card ───────────────────────────────────────────────────────────
  if (CONFIG.SHOW_BRANDING) {
    const myS = si++;
    sched(t, () => {
      setStage(myS);
      endCard.style.transition = `opacity ${CONFIG.TIMING.endFade}ms ease`;
      endCard.style.opacity    = '1';
    });
    t += CONFIG.TIMING.endCard;
    sched(t, () => {
      endCard.style.transition = `opacity ${CONFIG.TIMING.endFade}ms ease`;
      endCard.style.opacity    = '0';
    });
    t += CONFIG.TIMING.endFade;
  }

  // ── Loop ──────────────────────────────────────────────────────────────────
  if (CONFIG.LOOP) sched(t + 600, startSizzler);
}

/* ==========================================================================
   INIT
   ========================================================================== */
function init() {
  injectAnchors();
  startSizzler();
}

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') startSizzler();
  if ((e.key === 'p' || e.key === 'P') && POLYGONS_RAW.length > 0) startPolygonStage();
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else setTimeout(init, 0);
</script>
</body>
</html>
